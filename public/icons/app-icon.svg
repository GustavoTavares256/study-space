<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FDF8F5" />
      <stop offset="60%" stop-color="#F4DDE5" />
      <stop offset="100%" stop-color="#EBC6D4" />
    </radialGradient>
    <radialGradient id="petalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E9EE" />
      <stop offset="100%" stop-color="#F4DDE5" />
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9A6B8" />
      <stop offset="100%" stop-color="#C58FA3" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
      <feOffset dx="0" dy="8" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo arredondado (ícone de app) -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)" />

  <!-- Brilho suave superior -->
  <ellipse cx="512" cy="260" rx="340" ry="220" fill="#FFFFFF" opacity="0.55" filter="url(#softBlur)" />

  <!-- Pétalas de Sakura ao redor -->
  <g filter="url(#petalShadow)">
    <ellipse cx="330" cy="290" rx="110" ry="80" fill="url(#petalGrad)" transform="rotate(-26 330 290)" stroke="url(#centerGrad)" stroke-width="6" />
    <ellipse cx="694" cy="290" rx="110" ry="80" fill="url(#petalGrad)" transform="rotate(26 694 290)" stroke="url(#centerGrad)" stroke-width="6" />
    <ellipse cx="300" cy="540" rx="110" ry="80" fill="url(#petalGrad)" transform="rotate(26 300 540)" stroke="url(#centerGrad)" stroke-width="6" />
    <ellipse cx="724" cy="540" rx="110" ry="80" fill="url(#petalGrad)" transform="rotate(-26 724 540)" stroke="url(#centerGrad)" stroke-width="6" />
    <ellipse cx="512" cy="740" rx="110" ry="80" fill="url(#petalGrad)" transform="rotate(0 512 740)" stroke="url(#centerGrad)" stroke-width="6" />
  </g>

  <!-- Flor central -->
  <circle cx="512" cy="512" r="100" fill="url(#centerGrad)" stroke="#C58FA3" stroke-width="10" filter="url(#petalShadow)" />
  <circle cx="512" cy="512" r="56" fill="#F9E9EE" />
  <circle cx="512" cy="512" r="16" fill="#C58FA3" />

  <!-- Pontos delicados no centro -->
  <g fill="#C58FA3" opacity="0.85">
    <circle cx="492" cy="492" r="9" />
    <circle cx="532" cy="492" r="9" />
    <circle cx="512" cy="532" r="9" />
  </g>

  <!-- Borda sutil -->
  <rect width="1024" height="1024" rx="230" fill="none" stroke="#C58FA3" stroke-width="18" opacity="0.35" />
</svg>
